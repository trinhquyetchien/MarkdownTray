name: CI - Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install system dependencies (GTK, WebKit)
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 gir1.2-ayatanaappindicator3-0.1 python3-venv

    - name: Set up Python Virtual Environment
      run: |
        python3 -m venv --system-site-packages venv
        echo "$PWD/venv/bin" >> $GITHUB_PATH

    - name: Install Python dependencies
      run: |
        pip install markdown-it-py>=3.0.0

    - name: Test (Syntax Check)
      run: |
        python3 -m py_compile md_tray_app.py
