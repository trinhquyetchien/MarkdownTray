<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-main: #1c1c1e;
        --bg-header: #2c2c2e;
        --bg-modal: rgba(44, 44, 46, 0.95);
        --bg-input: #1c1c1e;
        --border-color: #38383a;
        --grid-line: #2c2c2e;
        --text-main: #f5f5f7;
        --text-muted: #98989d;
        --text-today: #0a84ff;
        --btn-bg: #3a3a3c;
        --btn-hover: #48484a;
        --btn-primary: #0a84ff;
        --btn-danger: #ff453a;
        --radius: 8px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Be Vietnam Pro", sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        background: var(--bg-main);
        color: var(--text-main);
        -webkit-font-smoothing: antialiased;
      }

      /* Header */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 24px;
        background: var(--bg-header);
        border-bottom: 1px solid var(--border-color);
        box-shadow: 0 1px 10px rgba(0, 0, 0, 0.1);
        z-index: 20;
      }

      .header button {
        padding: 8px 16px;
        border: 1px solid var(--border-color);
        background: var(--btn-bg);
        color: var(--text-main);
        border-radius: var(--radius);
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        font-family: inherit;
        transition: all 0.2s ease;
      }

      .header button:hover {
        background: var(--btn-hover);
        transform: translateY(-1px);
      }

      .header h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }

      .calendar-container {
        flex: 1;
        overflow-y: auto;
        position: relative;
        user-select: none;
        -webkit-user-select: none;
        background: var(--bg-main);
      }

      .scroll-inner {
        display: flex;
        min-height: 100%;
        height: max-content;
      }

      .time-col {
        width: 65px;
        flex-shrink: 0;
        border-right: 1px solid var(--border-color);
        position: relative;
        background: var(--bg-main);
      }

      .time-slot {
        height: 60px;
        border-bottom: 1px solid transparent;
        text-align: right;
        padding-right: 12px;
        font-size: 12px;
        color: var(--text-muted);
        position: relative;
        font-weight: 500;
      }

      .time-slot::after {
        content: "";
        position: absolute;
        right: 0;
        top: 0;
        border-bottom: 1px solid var(--border-color);
        width: 8px;
      }

      .days-container {
        display: flex;
        flex: 1;
        position: relative;
      }

      .day-col {
        flex: 1;
        position: relative;
        min-width: 100px;
      }

      .day-header {
        text-align: center;
        font-weight: 600;
        padding: 12px 0;
        border-bottom: 1px solid var(--border-color);
        border-right: 1px solid var(--border-color);
        background: var(--bg-header);
        position: sticky;
        top: 0;
        z-index: 10;
        font-size: 14px;
        color: var(--text-main);
      }

      .day-header.today {
        color: var(--text-today);
      }

      .grid-lines {
        pointer-events: none;
        display: flex;
        flex-direction: column;
      }

      .grid-line {
        height: 60px;
        border-bottom: 1px solid var(--grid-line);
        border-right: 1px solid var(--border-color);
        width: 100%;
        flex-shrink: 0;
      }

      .event {
        position: absolute;
        left: 4px;
        right: 4px;
        border-radius: var(--radius);
        padding: 6px 8px;
        font-size: 12px;
        overflow: hidden;
        cursor: pointer;
        color: white;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        border-left: 4px solid rgba(255, 255, 255, 0.4);
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease,
          filter 0.15s ease;
      }

      .event:hover {
        z-index: 20;
        transform: translateY(-1px) scale(1.01);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      }

      .event.dragging {
        transform: scale(1);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        opacity: 0.7 !important;
        filter: brightness(1.1);
        z-index: 30;
      }

      .event-title {
        font-weight: 600;
        margin-bottom: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 13px;
      }

      .event-note {
        font-size: 11px;
        opacity: 0.9;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #current-time-line {
        position: absolute;
        left: 0;
        right: 0;
        height: 2px;
        background-color: #ff453a;
        pointer-events: none;
        z-index: 30;
      }

      #current-time-line::before {
        content: "";
        position: absolute;
        left: -5px;
        top: -4px;
        width: 10px;
        height: 10px;
        background-color: #ff453a;
        border-radius: 50%;
        box-shadow: 0 0 4px rgba(255, 69, 58, 0.5);
      }

      /* Modal */
      #modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        z-index: 100;
        align-items: center;
        justify-content: center;
      }

      .modal-content {
        background: var(--bg-modal);
        padding: 28px;
        border-radius: 12px;
        width: 360px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        border: 1px solid var(--border-color);
        color: var(--text-main);
      }

      .modal-content h3 {
        margin-top: 0;
        margin-bottom: 20px;
        font-weight: 600;
        font-size: 18px;
      }

      .modal-content label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        color: var(--text-muted);
        font-weight: 500;
      }

      .modal-content input[type="text"],
      .modal-content textarea,
      .modal-content input[type="time"] {
        width: 100%;
        margin-bottom: 16px;
        padding: 10px 12px;
        border: 1px solid var(--border-color);
        background: var(--bg-input);
        color: var(--text-main);
        border-radius: var(--radius);
        font-family: inherit;
        font-size: 14px;
        outline: none;
        transition: border 0.2s;
      }

      .modal-content input:focus,
      .modal-content textarea:focus {
        border-color: var(--btn-primary);
      }

      .modal-content input[type="color"] {
        width: 100%;
        height: 40px;
        border: 1px solid var(--border-color);
        cursor: pointer;
        margin-bottom: 24px;
        border-radius: var(--radius);
        background: var(--bg-input);
        padding: 2px;
      }

      .modal-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }

      .modal-buttons button {
        padding: 10px 18px;
        border: none;
        border-radius: var(--radius);
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        transition: background 0.2s;
      }

      .btn-cancel {
        background: var(--btn-bg);
        color: var(--text-main);
      }

      .btn-cancel:hover {
        background: var(--btn-hover);
      }

      .btn-save {
        background: var(--btn-primary);
        color: white;
      }

      .btn-save:hover {
        background: #007aff;
      }

      .btn-delete {
        background: rgba(255, 69, 58, 0.1);
        color: var(--btn-danger);
        margin-right: auto;
        border: 1px solid rgba(255, 69, 58, 0.3) !important;
      }

      .btn-delete:hover {
        background: rgba(255, 69, 58, 0.2);
      }

      .drag-ghost {
        position: absolute;
        left: 4px;
        right: 4px;
        background: rgba(10, 132, 255, 0.15);
        border: 1.5px dashed var(--btn-primary);
        pointer-events: none;
        z-index: 50;
        border-radius: var(--radius);
      }

      input[type="date"] {
        background: var(--bg-input);
        color: var(--text-main);
        border: 1px solid var(--border-color);
        padding: 6px 12px;
        border-radius: var(--radius);
        cursor: pointer;
        color-scheme: dark;
        font-family: inherit;
        font-size: 14px;
        outline: none;
        transition: border 0.2s;
      }

      input[type="date"]:focus {
        border-color: var(--btn-primary);
      }
    </style>
  </head>

  <body>
    <div class="header">
      <button onclick="changeWeek(-1)">&#8592; Previous</button>
      <div style="display: flex; align-items: center; gap: 16px">
        <h2 id="week-label">Week</h2>
        <input type="date" id="date-picker" onchange="jumpToDate(this.value)" />
      </div>
      <button onclick="changeWeek(1)">Next &#8594;</button>
    </div>

    <div
      style="
        display: flex;
        border-bottom: 1px solid var(--border-color);
        background: var(--bg-header);
      "
    >
      <div
        style="width: 65px; flex-shrink: 0; background: var(--bg-header)"
      ></div>
      <div class="days-container" id="day-headers"></div>
    </div>

    <div class="calendar-container" id="scroll-area">
      <div class="scroll-inner">
        <div class="time-col" id="time-labels"></div>
        <div class="days-container" id="days-bg"></div>
      </div>
    </div>

    <div id="modal">
      <div class="modal-content">
        <h3 id="modal-title">Event Details</h3>
        <label>Title</label>
        <input
          type="text"
          id="ev-title"
          placeholder="What are you working on?"
        />
        <label>Notes</label>
        <textarea
          id="ev-note"
          placeholder="Add some details..."
          rows="3"
        ></textarea>

        <div style="display: flex; gap: 12px">
          <div style="flex: 1">
            <label>Start Time</label>
            <input type="time" id="ev-start" />
          </div>
          <div style="flex: 1">
            <label>End Time</label>
            <input type="time" id="ev-end" />
          </div>
        </div>

        <label>Event Color</label>
        <input type="color" id="ev-color" value="#0a84ff" />

        <div class="modal-buttons">
          <button id="btn-delete" class="btn-delete">Delete</button>
          <button onclick="closeModal()" class="btn-cancel">Cancel</button>
          <button onclick="saveModal()" class="btn-save">Save</button>
        </div>
      </div>
    </div>

    <script>
      const PIXELS_PER_HOUR = 60;
      let currentDate = new Date();
      let events = [];
      let currentEventId = null;

      function sendToPython(action, data) {
        if (
          window.webkit &&
          window.webkit.messageHandlers &&
          window.webkit.messageHandlers.calendar_action
        ) {
          window.webkit.messageHandlers.calendar_action.postMessage(
            JSON.stringify({ action: action, data: data }),
          );
        }
      }

      function loadData(eventsJson) {
        if (eventsJson) {
          try {
            events = JSON.parse(eventsJson);
          } catch (e) {
            events = [];
          }
        }
        renderCalendar();
        setTimeout(() => {
          const scrollArea = document.getElementById("scroll-area");
          if (scrollArea.scrollTop === 0)
            scrollArea.scrollTop = 8 * PIXELS_PER_HOUR - 100;
        }, 50);
      }

      function getStartOfWeek(d) {
        const date = new Date(d);
        const day = date.getDay() || 7;
        if (day !== 1) date.setHours(-24 * (day - 1));
        date.setHours(0, 0, 0, 0);
        return date;
      }

      function changeWeek(offset) {
        currentDate.setDate(currentDate.getDate() + offset * 7);
        renderCalendar();
      }

      function formatDateYMD(d) {
        return (
          d.getFullYear() +
          "-" +
          String(d.getMonth() + 1).padStart(2, "0") +
          "-" +
          String(d.getDate()).padStart(2, "0")
        );
      }

      function jumpToDate(dateStr) {
        if (!dateStr) return;
        currentDate = new Date(dateStr);
        renderCalendar();
      }

      function updateCurrentTimeLine() {
        let line = document.getElementById("current-time-line");
        if (line) line.remove();

        const now = new Date();
        const startOfWeek = getStartOfWeek(currentDate);
        const endOfWeek = new Date(startOfWeek);
        endOfWeek.setDate(endOfWeek.getDate() + 7);

        if (now >= startOfWeek && now < endOfWeek) {
          const todayStr = formatDateYMD(now);
          const col = document.querySelector(
            `.day-col[data-date="${todayStr}"]`,
          );
          if (col) {
            line = document.createElement("div");
            line.id = "current-time-line";
            const h = now.getHours();
            const m = now.getMinutes();
            const top = (h + m / 60) * PIXELS_PER_HOUR;
            line.style.top = top + "px";
            col.appendChild(line);
          }
        }
      }

      let isDragging = false;
      let startY = 0;
      let dragGhost = null;
      let activeCol = null;
      let activeDateStr = null;

      document.addEventListener("mousemove", (e) => {
        if (!isDragging || !dragGhost || !activeCol) return;
        const rect = activeCol.getBoundingClientRect();
        let currentY = e.clientY - rect.top;
        currentY = Math.max(0, Math.min(currentY, 24 * PIXELS_PER_HOUR));

        const top = Math.min(startY, currentY);
        const height = Math.abs(currentY - startY);
        dragGhost.style.top = top + "px";
        dragGhost.style.height = height + "px";
      });

      document.addEventListener("mouseup", (e) => {
        if (!isDragging) return;
        isDragging = false;
        if (dragGhost) {
          const top = parseFloat(dragGhost.style.top);
          const height = parseFloat(dragGhost.style.height);
          dragGhost.remove();
          dragGhost = null;

          if (height > 10) openModalForNew(activeDateStr, top, height);
        }
        activeCol = null;
      });

      function renderCalendar() {
        const startOfWeek = getStartOfWeek(currentDate);
        const endOfWeek = new Date(startOfWeek);
        endOfWeek.setDate(endOfWeek.getDate() + 6);

        const monthNames = [
          "Jan",
          "Feb",
          "Mar",
          "Apr",
          "May",
          "Jun",
          "Jul",
          "Aug",
          "Sep",
          "Oct",
          "Nov",
          "Dec",
        ];
        document.getElementById("week-label").innerText =
          `${monthNames[startOfWeek.getMonth()]} ${startOfWeek.getDate()} - ${monthNames[endOfWeek.getMonth()]} ${endOfWeek.getDate()}, ${startOfWeek.getFullYear()}`;
        document.getElementById("date-picker").value =
          formatDateYMD(currentDate);

        const timeLabels = document.getElementById("time-labels");
        timeLabels.innerHTML = "";
        for (let i = 0; i < 24; i++) {
          const div = document.createElement("div");
          div.className = "time-slot";
          if (i > 0) div.innerText = i + ":00";
          timeLabels.appendChild(div);
        }

        const headers = document.getElementById("day-headers");
        const daysBg = document.getElementById("days-bg");
        headers.innerHTML = "";
        daysBg.innerHTML = "";

        const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
        const todayStr = formatDateYMD(new Date());

        for (let i = 0; i < 7; i++) {
          const d = new Date(startOfWeek);
          d.setDate(d.getDate() + i);
          const dateStr = formatDateYMD(d);

          const hDiv = document.createElement("div");
          hDiv.className =
            "day-col day-header" + (dateStr === todayStr ? " today" : "");
          hDiv.innerText =
            days[i] + " " + d.getDate() + "/" + (d.getMonth() + 1);
          headers.appendChild(hDiv);

          const col = document.createElement("div");
          col.className = "day-col";
          col.dataset.date = dateStr;

          const gridLines = document.createElement("div");
          gridLines.className = "grid-lines";
          for (let h = 0; h < 24; h++) {
            const line = document.createElement("div");
            line.className = "grid-line";
            gridLines.appendChild(line);
          }
          col.appendChild(gridLines);

          col.addEventListener("mousedown", (e) => {
            if (e.target.closest(".event")) return;
            if (e.button !== 0) return;
            e.preventDefault();
            isDragging = true;
            activeCol = col;
            activeDateStr = dateStr;
            const rect = col.getBoundingClientRect();
            startY = e.clientY - rect.top;

            dragGhost = document.createElement("div");
            dragGhost.className = "drag-ghost";
            dragGhost.style.top = startY + "px";
            dragGhost.style.height = "0px";
            col.appendChild(dragGhost);
          });

          col.addEventListener("dragover", (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";

            if (window.currentDraggingEventId) {
              const ev = events.find(
                (x) => x.id === window.currentDraggingEventId,
              );
              if (ev) {
                const durationMs =
                  new Date(ev.end).getTime() - new Date(ev.start).getTime();
                const height =
                  (durationMs / (1000 * 60 * 60)) * PIXELS_PER_HOUR;

                const offsetY = window.currentDraggingOffsetY || 0;
                const rect = col.getBoundingClientRect();
                let newY = e.clientY - rect.top - offsetY;
                newY = Math.max(
                  0,
                  Math.min(newY, 24 * PIXELS_PER_HOUR - height),
                );

                let startH = Math.floor(newY / PIXELS_PER_HOUR);
                let startM = Math.floor(
                  ((newY % PIXELS_PER_HOUR) / PIXELS_PER_HOUR) * 60,
                );
                startM = Math.round(startM / 15) * 15;
                if (startM === 60) {
                  startH++;
                  startM = 0;
                }

                const snappedTop = (startH + startM / 60) * PIXELS_PER_HOUR;

                if (!window.dropPlaceholder) {
                  window.dropPlaceholder = document.createElement("div");
                  window.dropPlaceholder.className = "drag-ghost";
                  window.dropPlaceholder.innerHTML = '<div class="drag-ghost-title" style="padding: 6px 8px; color: white; font-weight: 600; font-size: 13px; text-shadow: 0 1px 2px rgba(0,0,0,0.8);"></div>';
                }

                if (window.dropPlaceholder.parentElement !== col) {
                  col.appendChild(window.dropPlaceholder);
                }
                
                const titleEl = window.dropPlaceholder.querySelector('.drag-ghost-title');
                if (titleEl) {
                  const sH = String(startH).padStart(2, '0');
                  const sM = String(startM).padStart(2, '0');
                  titleEl.innerHTML = `${sH}:${sM} - ${escapeHtml(ev.title || 'Task')}`;
                }

                window.dropPlaceholder.style.top = snappedTop + "px";
                window.dropPlaceholder.style.height = height + "px";
                window.dropPlaceholder.style.display = "block";
              }
            }
          });
          col.addEventListener("drop", (e) => {
            e.preventDefault();
            if (window.dropPlaceholder)
              window.dropPlaceholder.style.display = "none";
            const evId = e.dataTransfer.getData("text/plain");
            if (!evId) return;
            const offsetY = parseFloat(e.dataTransfer.getData("offsetY") || 0);

            const eventIndex = events.findIndex((x) => x.id === evId);
            if (eventIndex >= 0) {
              const ev = events[eventIndex];
              const durationMs =
                new Date(ev.end).getTime() - new Date(ev.start).getTime();

              const rect = col.getBoundingClientRect();
              let newY = e.clientY - rect.top - offsetY;
              newY = Math.max(0, Math.min(newY, 24 * PIXELS_PER_HOUR));

              let startH = Math.floor(newY / PIXELS_PER_HOUR);
              let startM = Math.floor(
                ((newY % PIXELS_PER_HOUR) / PIXELS_PER_HOUR) * 60,
              );
              startM = Math.round(startM / 15) * 15;
              if (startM === 60) {
                startH++;
                startM = 0;
              }
              if (startH >= 24) {
                startH = 23;
                startM = 45;
              }

              const newStartStr =
                dateStr +
                "T" +
                String(startH).padStart(2, "0") +
                ":" +
                String(startM).padStart(2, "0") +
                ":00";
              const newStart = new Date(newStartStr);
              const newEnd = new Date(newStart.getTime() + durationMs);

              ev.start =
                formatDateYMD(newStart) +
                "T" +
                String(newStart.getHours()).padStart(2, "0") +
                ":" +
                String(newStart.getMinutes()).padStart(2, "0") +
                ":00";
              ev.end =
                formatDateYMD(newEnd) +
                "T" +
                String(newEnd.getHours()).padStart(2, "0") +
                ":" +
                String(newEnd.getMinutes()).padStart(2, "0") +
                ":00";

              saveEvents();
            }
          });

          daysBg.appendChild(col);
        }

        const dateToEvents = {};
        events.forEach((ev) => {
          const dateStr = ev.start.substring(0, 10);
          if (!dateToEvents[dateStr]) dateToEvents[dateStr] = [];

          const startHour = parseInt(ev.start.substring(11, 13));
          const startMin = parseInt(ev.start.substring(14, 16));
          const endHour = parseInt(ev.end.substring(11, 13));
          const endMin = parseInt(ev.end.substring(14, 16));

          const top = (startHour + startMin / 60) * PIXELS_PER_HOUR;
          let bottom = (endHour + endMin / 60) * PIXELS_PER_HOUR;
          if (bottom - top < 20) bottom = top + 20;

          dateToEvents[dateStr].push({
            ev,
            top,
            bottom,
            startHour,
            startMin,
            endHour,
            endMin,
          });
        });

        for (const dateStr in dateToEvents) {
          const col = document.querySelector(
            `.day-col[data-date="${dateStr}"]`,
          );
          if (!col) continue;

          const dayEvents = dateToEvents[dateStr].sort((a, b) => a.top - b.top);
          let columns = [];
          let lastEventEnding = null;

          function packEvents(columnsToPack) {
            const numColumns = columnsToPack.length;
            columnsToPack.forEach((colArray, i) => {
              colArray.forEach((item) => {
                item.left = (i / numColumns) * 100;
                item.width = (1 / numColumns) * 100;
              });
            });
          }

          dayEvents.forEach((item) => {
            if (lastEventEnding !== null && item.top >= lastEventEnding) {
              packEvents(columns);
              columns = [];
              lastEventEnding = null;
            }

            let placed = false;
            for (let i = 0; i < columns.length; i++) {
              if (columns[i][columns[i].length - 1].bottom <= item.top) {
                columns[i].push(item);
                placed = true;
                break;
              }
            }
            if (!placed) columns.push([item]);

            if (lastEventEnding === null || item.bottom > lastEventEnding) {
              lastEventEnding = item.bottom;
            }
          });
          if (columns.length > 0) packEvents(columns);

          dayEvents.forEach((item) => {
            const evDiv = document.createElement("div");
            evDiv.className = "event";
            evDiv.style.top = item.top + "px";
            evDiv.style.height = item.bottom - item.top + "px";
            evDiv.style.left = `calc(${item.left}% + 4px)`;
            evDiv.style.width = `calc(${item.width}% - 8px)`;
            evDiv.style.right = "auto";
            evDiv.style.backgroundColor = item.ev.color || "#0a84ff";
            evDiv.setAttribute("draggable", "true");

            const timeStr = `${String(item.startHour).padStart(2, "0")}:${String(item.startMin).padStart(2, "0")} - ${String(item.endHour).padStart(2, "0")}:${String(item.endMin).padStart(2, "0")}`;

            evDiv.innerHTML = `
                    <div class="event-title">${escapeHtml(item.ev.title)}</div>
                    <div style="font-size: 10px; font-weight: 500; opacity: 0.9; margin-bottom: 2px;">${timeStr}</div>
                    ${item.ev.note ? `<div class="event-note">${escapeHtml(item.ev.note)}</div>` : ""}
                `;

            evDiv.addEventListener("mousedown", (e) => e.stopPropagation());
            evDiv.addEventListener("click", (e) => {
              e.stopPropagation();
              openModalForEdit(item.ev);
            });
            evDiv.addEventListener("dragstart", (e) => {
              window.currentDraggingEventId = item.ev.id;
              const rect = evDiv.getBoundingClientRect();
              window.currentDraggingOffsetY = e.clientY - rect.top;

              e.dataTransfer.setData("text/plain", item.ev.id);
              e.dataTransfer.setData("offsetY", window.currentDraggingOffsetY);
              
              // Cách an toàn để giấu ảnh lơ lửng khổng lồ của WebKitGTK: 
              // dùng 1 div trong suốt thay vì Image để tránh crash
              let ghostEl = document.getElementById('drag-ghost-hider');
              if (!ghostEl) {
                  ghostEl = document.createElement('div');
                  ghostEl.id = 'drag-ghost-hider';
                  ghostEl.style.width = '1px';
                  ghostEl.style.height = '1px';
                  ghostEl.style.position = 'absolute';
                  ghostEl.style.top = '-1000px';
                  document.body.appendChild(ghostEl);
              }
              e.dataTransfer.setDragImage(ghostEl, 0, 0);

              setTimeout(() => evDiv.classList.add("dragging"), 0);
            });
            evDiv.addEventListener("dragend", (e) => {
              evDiv.classList.remove("dragging");
              window.currentDraggingEventId = null;
              if (window.dropPlaceholder)
                window.dropPlaceholder.style.display = "none";
            });

            col.appendChild(evDiv);
          });
        }

        updateCurrentTimeLine();
      }

      function escapeHtml(unsafe) {
        return (unsafe || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function openModalForNew(dateStr, top, height) {
        currentEventId = null;
        document.getElementById("modal-title").innerText = "New Task";
        document.getElementById("ev-title").value = "";
        document.getElementById("ev-note").value = "";

        let startH = Math.floor(top / PIXELS_PER_HOUR);
        let startM = Math.floor(
          ((top % PIXELS_PER_HOUR) / PIXELS_PER_HOUR) * 60,
        );
        startM = Math.round(startM / 15) * 15;
        if (startM === 60) {
          startH++;
          startM = 0;
        }

        let endH = Math.floor((top + height) / PIXELS_PER_HOUR);
        let endM = Math.floor(
          (((top + height) % PIXELS_PER_HOUR) / PIXELS_PER_HOUR) * 60,
        );
        endM = Math.round(endM / 15) * 15;
        if (endM === 60) {
          endH++;
          endM = 0;
        }

        if (startH === endH && startM === endM) {
          endM += 30;
          if (endM >= 60) {
            endH++;
            endM -= 60;
          }
        }

        if (endH >= 24) {
          endH = 23;
          endM = 59;
        }
        if (startH >= 24) {
          startH = 23;
          startM = 30;
        }

        document.getElementById("ev-start").dataset.date = dateStr;
        document.getElementById("ev-start").value =
          String(startH).padStart(2, "0") +
          ":" +
          String(startM).padStart(2, "0");
        document.getElementById("ev-end").value =
          String(endH).padStart(2, "0") + ":" + String(endM).padStart(2, "0");

        document.getElementById("btn-delete").style.display = "none";
        document.getElementById("modal").style.display = "flex";
        setTimeout(() => document.getElementById("ev-title").focus(), 100);
      }

      function openModalForEdit(ev) {
        currentEventId = ev.id;
        document.getElementById("modal-title").innerText = "Edit Task";
        document.getElementById("ev-title").value = ev.title;
        document.getElementById("ev-note").value = ev.note || "";
        document.getElementById("ev-color").value = ev.color || "#0a84ff";

        document.getElementById("ev-start").dataset.date = ev.start.substring(
          0,
          10,
        );
        document.getElementById("ev-start").value = ev.start.substring(11, 16);
        document.getElementById("ev-end").value = ev.end.substring(11, 16);

        document.getElementById("btn-delete").style.display = "inline-block";
        document.getElementById("btn-delete").onclick = () => {
          events = events.filter((e) => e.id !== ev.id);
          closeModal();
          saveEvents();
        };

        document.getElementById("modal").style.display = "flex";
        setTimeout(() => document.getElementById("ev-title").focus(), 100);
      }

      function closeModal() {
        document.getElementById("modal").style.display = "none";
      }

      function saveModal() {
        const title = document.getElementById("ev-title").value || "Untitled";
        const note = document.getElementById("ev-note").value;
        const color = document.getElementById("ev-color").value;

        const dateStr = document.getElementById("ev-start").dataset.date;
        const startTime = document.getElementById("ev-start").value;
        let endTime = document.getElementById("ev-end").value;

        if (startTime >= endTime) {
          let [h, m] = startTime.split(":").map(Number);
          m += 30;
          if (m >= 60) {
            h++;
            m -= 60;
          }
          endTime =
            String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
        }

        const newEv = {
          id: currentEventId || Date.now().toString(),
          title: title,
          note: note,
          color: color,
          start: dateStr + "T" + startTime + ":00",
          end: dateStr + "T" + endTime + ":00",
        };

        if (currentEventId) {
          const idx = events.findIndex((e) => e.id === currentEventId);
          if (idx >= 0) events[idx] = newEv;
        } else {
          events.push(newEv);
        }

        closeModal();
        saveEvents();
      }

      function saveEvents() {
        renderCalendar();
        sendToPython("save_events", events);
      }

      setInterval(updateCurrentTimeLine, 60000);
    </script>
  </body>
</html>
